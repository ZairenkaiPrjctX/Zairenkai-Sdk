name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contract schemas, fixtures and producer mirrors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the hash-locked validator (the runner's Python 3.12)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.lock
      - name: Contract tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Every fixture against its schema
        run: .venv/bin/python tools/zsdk.py validate
      # The producer repositories are public: fetch each pinned commit without credentials and
      # compare the mirrored schemas byte for byte.
      - name: Mirrors equal their producers at the pinned commits
        run: |
          fetch() { # fetch <dir> <repository> <commit>
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "https://github.com/$2.git" "$3"
          }
          args=()
          while IFS=' ' read -r name repo commit; do
            fetch "producers/$name" "$repo" "$commit"
            args+=("$name=producers/$name")
          done < <(python3 -c 'import json; [print(k, v["repository"], v["commit"]) for k, v in json.load(open("contracts/sources.json"))["producers"].items()]')
          .venv/bin/python tools/zsdk.py check-mirrors "${args[@]}"
